services:
  engram-feed:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ~/.engram:/root/.engram:ro
    environment:
      - ENGRAM_FEED_ADDR=0.0.0.0:8080
      - ENGRAM_DSN=/root/.engram/engram.db
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_TARGET=http://engram-feed:8080
    restart: unless-stopped